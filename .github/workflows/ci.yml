name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Bağımlılıklar
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check .
      - name: Pytest
        run: uv run pytest -m "not camera"
